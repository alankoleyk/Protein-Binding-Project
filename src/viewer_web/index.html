<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProteinBinding molecule viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { color: #999; font: 11px -apple-system, BlinkMacSystemFont, sans-serif; }
    #molecule { position: absolute; inset: 0; background: #000; }
    #complex { position: absolute; top: 8px; left: 10px; pointer-events: none; color: #999; font: 10px ui-monospace, monospace; }
    #error { position: absolute; inset: 0; display: grid; place-content: center; padding: 48px; color: #efbf79; text-align: center; }
    #error[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="molecule" aria-label="Protein complex. Drag to rotate, scroll to zoom, click a residue to select it."></div>
  <div id="complex">Loading structure</div>
  <div id="error" hidden></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="../resources/vendor/3Dmol.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
